org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compile Kotlin inside the Gradle build rather than a separate daemon. The
# daemon fails on machines whose user folder has an apostrophe in it
# (its temp-file paths break), and in-process is fine for an app this size.
kotlin.compiler.execution.strategy=in-process
# In-process compiles of several plugin modules at once trip over Kotlin's
# incremental caches ("Could not close incremental caches"); full compiles
# are quick at this size.
kotlin.incremental=false
