<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stylux — Next-generation salon management dashboard for salon staff and owners.">

  <!--
    This tag was missing entirely, which is the single biggest reason the
    Home Screen app felt sluggish on iOS: with no viewport declared, Safari
    lays the page out at a 980px virtual width and scales it down, keeps
    double-tap-to-zoom enabled, and therefore holds every tap for ~300ms to
    see whether a second tap is coming. Declaring the viewport removes that
    delay, so taps register immediately.
    (viewport-fit=cover is requested too, but note Flutter's engine rewrites
    this tag after boot and strips it - see the status-bar comment below.)
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Older iOS still only honours the apple- prefixed form for standalone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    Deliberately "black" rather than "black-translucent". Flutter's engine
    rewrites the viewport meta at runtime and drops viewport-fit=cover, so
    env(safe-area-inset-*) never reports real values - with a translucent bar
    the top of the UI would slide under the clock and notch with no padding
    to compensate. "black" makes iOS reserve the status bar area instead, so
    nothing can overlap. Switch to black-translucent only if you verify the
    insets land correctly on a real device.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stylux">
  <meta name="theme-color" content="#090D16">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stylux — Salon Management Made Simple</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #090D16;
      /* Kills the grey flash Safari paints on every tap. */
      -webkit-tap-highlight-color: transparent;
      /* Flutter draws its own selection; the native callout just gets in
         the way and makes long-presses feel broken. */
      -webkit-user-select: none;
      user-select: none;
      /* Stops the whole shell rubber-banding / pull-to-refreshing behind the
         canvas, which reads as the app "slipping" when you scroll a list. */
      overscroll-behavior: none;
      /* Belt and braces with the viewport tag above: no double-tap zoom, so
         no tap delay. */
      touch-action: manipulation;
    }

    /* Shown until Flutter paints its first frame. Without it the app is a
       blank white rectangle while the CanvasKit wasm loads, which reads as a
       freeze on a cold start. Matches the in-app splash so the handover is
       invisible. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090D16;
      z-index: 2147483647;
      transition: opacity 260ms ease-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle,
                  rgba(79, 70, 229, 0.16) 0%,
                  rgba(124, 58, 237, 0.08) 50%,
                  rgba(9, 13, 22, 0) 100%);
    }
    #boot .mark {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 34px rgba(79, 70, 229, 0.34);
      animation: boot-pulse 1600ms ease-in-out infinite;
    }
    #boot .mark svg { width: 40px; height: 40px; }
    #boot .word {
      position: relative;
      margin-top: 26px;
      color: #FFFFFF;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 4.2px;
    }
    #boot .tag {
      position: relative;
      margin-top: 8px;
      color: #94A3B8;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 2.8px;
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(0.96); box-shadow: 0 10px 28px rgba(79, 70, 229, 0.28); }
      50%      { transform: scale(1.00); box-shadow: 0 14px 40px rgba(79, 70, 229, 0.44); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .mark { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="glow"></div>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
    </div>
    <div class="word">STYLUX</div>
    <div class="tag">SALON &amp; STYLING OS</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter fires this once the framework has painted; only then is it safe
    // to uncover the canvas. Timeout is a safety net so a failed boot can
    // never leave the user staring at the placeholder forever.
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var hide = function () {
        if (boot.classList.contains('gone')) return;
        boot.classList.add('gone');
        setTimeout(function () { boot.remove(); }, 300);
      };
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 12000);
    })();
  </script>
</body>
</html>
