<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stylux — Next-generation salon management dashboard for salon staff and owners.">

  <!--
    This tag was missing entirely, which is the single biggest reason the
    Home Screen app felt sluggish on iOS: with no viewport declared, Safari
    lays the page out at a 980px virtual width and scales it down, keeps
    double-tap-to-zoom enabled, and therefore holds every tap for ~300ms to
    see whether a second tap is coming. Declaring the viewport removes that
    delay, so taps register immediately.
    (viewport-fit=cover is requested too, but note Flutter's engine rewrites
    this tag after boot and strips it - see the status-bar comment below.)
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Older iOS still only honours the apple- prefixed form for standalone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    Deliberately "black" rather than "black-translucent". Flutter's engine
    rewrites the viewport meta at runtime and drops viewport-fit=cover, so
    env(safe-area-inset-*) never reports real values - with a translucent bar
    the top of the UI would slide under the clock and notch with no padding
    to compensate. "black" makes iOS reserve the status bar area instead, so
    nothing can overlap. Switch to black-translucent only if you verify the
    insets land correctly on a real device.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stylux">
  <meta name="theme-color" content="#090D16">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stylux — Salon Management Made Simple</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      /* Also the cold-start screen. There used to be a branded "#boot"
         placeholder here that showed the Stylux mark and wordmark until
         Flutter's first frame - but the in-app splash then drew the same
         mark and wordmark again, so a cold start played the same animation
         twice. This colour matches the in-app splash canvas, so the wasm
         load is a quiet dark screen that hands straight over to it. */
      background-color: #090D16;
      /* Kills the grey flash Safari paints on every tap. */
      -webkit-tap-highlight-color: transparent;
      /* Flutter draws its own selection; the native callout just gets in
         the way and makes long-presses feel broken. */
      -webkit-user-select: none;
      user-select: none;
      /* Stops the whole shell rubber-banding / pull-to-refreshing behind the
         canvas, which reads as the app "slipping" when you scroll a list. */
      overscroll-behavior: none;
      /* Belt and braces with the viewport tag above: no double-tap zoom, so
         no tap delay. */
      touch-action: manipulation;
    }

  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
