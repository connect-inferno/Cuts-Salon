name: Keep Render backend awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.RENDER_BACKEND_URL }}" ]; then
            echo "RENDER_BACKEND_URL repo variable is not set yet - skipping ping."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "${{ vars.RENDER_BACKEND_URL }}/health"
